name: Synth CloudFormation template

# Regenerate the deployable template from the CDK app on every push and commit
# it back to the repo root, so cdk-vpc-vpn-gw.yaml always matches cdk/.
on:
  push:
    branches: [main, dev]
    paths:
      - 'cdk/**'
      - 'cdk-vpc-vpn-gw.yaml'
      - '.github/workflows/synth-template.yml'

# Let the job push the regenerated template back to the branch.
permissions:
  contents: write

# One run per branch. A newer push cancels an in-flight synth.
concurrency:
  group: synth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Synthesize template
        working-directory: cdk
        run: make synth

      - name: Commit regenerated template
        run: |
          if git diff --quiet -- cdk-vpc-vpn-gw.yaml; then
            echo "Template unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdk-vpc-vpn-gw.yaml
          git commit -m "chore: regenerate cdk-vpc-vpn-gw.yaml from CDK app [skip ci]"
          git push
